[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "firefly_solver"
version = "0.1.0"
description = "Firefly GPU-accelerated optimization solver"
readme = "../README.md"
requires-python = ">=3.10"

[tool.scikit-build]
# Build in release mode
cmake.build-type = "Release"
# Pass arguments to CMake if needed
cmake.args = ["-DWITH_CUDA=ON"]
