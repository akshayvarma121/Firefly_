name: Build and Release macOS

on:
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - '.github/workflows/build-mac.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11 cmake pyinstaller

      - name: Build C++ Core (CPU-only on Mac)
        working-directory: core
        run: |
          pip install .

      - name: Build macOS Executable via PyInstaller
        working-directory: core
        run: |
          pyinstaller firefly.spec --clean --distpath dist_new

      - name: Rename Executable for Mac
        working-directory: core/dist_new
        run: |
          mv firefly firefly-macos

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: core/dist_new/firefly-macos
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
